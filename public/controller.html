<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JS Joust Controller</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="controller">

        <h1>JS JOUST</h1>

        <p>
            Your phone is your controller.
        </p>


        <label for="roomInput">
            Room Code
        </label>


        <input
            id="roomInput"
            type="text"
            maxlength="6"
            autocomplete="off"
            placeholder="ABC123"
        >


        <button
            id="joinButton"
        >
            Join Game
        </button>


        <button
            id="motionButton"
            disabled
        >
            Enable Motion
        </button>


        <div
            id="status"
            class="status"
        >
            Enter a room code.
        </div>


        <div class="sensor-panel">

            <h2>Sensor Debug</h2>


            <p>
                X:
                <span id="gamma">
                    0
                </span>
            </p>


            <p>
                Y:
                <span id="beta">
                    0
                </span>
            </p>


            <p>
                Movement:
                <span id="movement">
                    0, 0
                </span>
            </p>


            <p>
                Sensor:
                <span id="sensorStatus">
                    Not enabled
                </span>
            </p>

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>
    <script src="/supabase.js"></script>
    <script src="config.js"></script>

    <script src="controller.js"></script>

</body>

</html>
