<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JS Joust MVP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>JS JOUST</h1>

        <div class="status">
            <span id="phase">SLOW</span>
            <span id="players">Players: 4</span>
        </div>

        <div id="arena">

            <div class="player human" id="player1">
                <span>YOU</span>
            </div>

            <div class="player enemy" id="player2">
                <span>AI 1</span>
            </div>

            <div class="player enemy" id="player3">
                <span>AI 2</span>
            </div>

            <div class="player enemy" id="player4">
                <span>AI 3</span>
            </div>

        </div>

        <p class="instructions">
            WASD / Arrow Keys to move
        </p>

        <button id="restart">Restart</button>

    </div>

    <script src="game.js"></script>

</body>
</html>
